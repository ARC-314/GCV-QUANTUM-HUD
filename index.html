<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARC-314 | QUANTUM CORE</title>
    <style>
        :root { --cyan: #00f2ff; --gold: #FFD700; }
        body, html { background: #000; color: var(--cyan); font-family: 'Courier New', monospace; margin: 0; padding: 0; overflow: hidden; height: 100vh; }

        /* MATRIX DYNAMIQUE LÉGÈRE */
        canvas { position: fixed; top: 0; left: 0; z-index: 1; opacity: 0.6; }

        /* FILTRE DE PROFONDEUR */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.9) 100%);
            z-index: 2; pointer-events: none;
        }

        /* TERMINAL HOLOGRAPHIQUE */
        .hud {
            position: relative; z-index: 10; height: 100vh;
            display: flex; flex-direction: column; padding: 15px; box-sizing: border-box;
            justify-content: center; align-items: center;
        }

        .core-unit {
            width: 100%; max-width: 450px;
            background: rgba(0, 10, 20, 0.85);
            border: 2px solid var(--cyan);
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.4);
            padding: 20px; border-radius: 2px;
            transform: perspective(500px) rotateX(2deg);
        }

        header { border-bottom: 2px solid var(--gold); margin-bottom: 15px; padding-bottom: 10px; text-align: left; }
        .title { font-size: 1.4em; font-weight: bold; color: var(--gold); letter-spacing: 4px; text-shadow: 0 0 10px var(--gold); }

        /* DUAL ENGINE CALCULATOR */
        .calc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .box { background: rgba(0,0,0,0.5); border: 1px solid var(--cyan); padding: 10px; text-align: center; }
        label { font-size: 0.6em; color: var(--gold); display: block; margin-bottom: 5px; }
        input { background: #000; border: 1px solid var(--gold); color: var(--gold); width: 100%; font-size: 1.2em; text-align: center; outline: none; }
        .res { font-size: 1em; margin-top: 5px; font-weight: bold; color: var(--gold); }

        /* STREAM BLOCKCHAIN */
        .stream { height: 100px; overflow: hidden; font-size: 0.7em; border-top: 1px solid rgba(0,242,255,0.2); padding-top: 10px; }
        .tx { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(0,242,255,0.1); padding: 4px 0; }

        /* SIGNATURE ARC314 */
        footer { width: 100%; display: flex; justify-content: space-between; align-items: flex-end; margin-top: 20px; }
        .sig { font-size: 2.5em; font-weight: bold; color: var(--gold); letter-spacing: 12px; text-shadow: 0 0 20px var(--gold); }
    </style>
</head>
