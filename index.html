<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARC-314 | QUANTUM CINEMATIC</title>
    <style>
        :root { --cyan: #00f2ff; --gold: #FFD700; --glow: rgba(0, 242, 255, 0.5); }
        body, html { background: #000; color: var(--cyan); font-family: 'Courier New', monospace; margin: 0; padding: 0; overflow: hidden; height: 100vh; }

        /* MATRIX BACKGROUND DENSE */
        canvas { position: fixed; top: 0; left: 0; z-index: 1; opacity: 0.8; filter: brightness(1.2); }

        /* EFFET DE LENTILLE ET PERSPECTIVE */
        .viewport {
            position: relative; z-index: 10; height: 100vh;
            perspective: 1000px; display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.8) 100%);
        }

        /* LE BLOC HOLOGRAPHIQUE (COMME SUR L'IMAGE) */
        .terminal {
            width: 90%; max-width: 500px; background: rgba(0, 15, 25, 0.9);
            border: 2px solid var(--cyan); border-radius: 5px; padding: 20px;
            transform: rotateX(5deg); box-shadow: 0 0 50px var(--glow), inset 0 0 20px var(--glow);
            backdrop-filter: blur(10px); position: relative;
        }

        .terminal::after {
            content: ""; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px;
            border: 1px solid var(--gold); pointer-events: none; opacity: 0.3;
        }
