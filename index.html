<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARC-314 | CORE</title>
    <style>
        :root { --cyan: #00f2ff; --gold: #FFD700; --glow: rgba(0, 242, 255, 0.7); }
        body, html { background: #000; color: var(--cyan); font-family: 'Courier New', monospace; margin: 0; padding: 0; overflow: hidden; height: 100vh; }

        /* FOND MATRIX ULTRA-DENSE */
        canvas { position: fixed; top: 0; left: 0; z-index: 1; opacity: 0.5; }

        /* EFFET DE LUEUR GLOBALE SUR L'ÉCRAN */
        .vignette {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.9) 100%);
            z-index: 2; pointer-events: none;
        }

        .container {
            position: relative; z-index: 10; height: 100vh;
            display: flex; align-items: center; justify-content: center; padding: 10px;
        }

        /* LE TERMINAL - VERSION LARGE ET INCLINÉE */
        .terminal {
            width: 95%; max-width: 550px;
            background: rgba(0, 10, 20, 0.9);
            border: 2px solid var(--cyan);
            box-shadow: 0 0 40px var(--glow), inset 0 0 20px var(--glow);
            padding: 30px;
            border-radius: 4px;
            /* L'inclinaison visuelle sans le crash 3D */
            transform: skewY(-1deg);
            position: relative;
        }

        /* EN-TÊTE IDENTIQUE À L'IMAGE */
        header { border-bottom: 2px solid var(--gold); margin-bottom: 20px; padding-bottom: 15px; }
        .title { font-size: 2em; font-weight: bold; color: var(--gold); text-shadow: 0 0 20px var(--gold); letter-spacing: 4px; line-height: 1; }
        .meta { font-size: 0.7em; margin-top: 10px; color: var(--cyan); font-weight: bold; }

        /* DUAL-ENGINE : LES BOITES DE CALCUL */
        .engine-zone { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .engine-box {
            border: 1px solid var(--cyan); background: rgba(0, 242, 255, 0.05);
            padding: 20px; text-align: center;
            box-shadow: inset 0 0 15px var(--glow);
            /* Coins coupés façon technologique */
            clip-path: polygon(0 0, 100% 0, 100% 85%, 85% 100%, 0 100%);
        }

        label { font-size: 0.6em; color: var(--gold); display: block; margin-bottom: 10px; font-weight: bold; }
        input { 
            background: transparent; border: none; border-bottom: 2px solid var(--gold); 
            color: var(--gold); width: 100%; font-size: 1.6em; text-align: center; outline: none; font-weight: bold;
        }
        .res { font-size: 1.2em; font-weight: bold; color: var(--gold); margin-top: 12px; text-shadow: 0 0 10px var(--gold); }

        /* STREAM BLOCKCHAIN */
        .blockchain { height: 120px; overflow: hidden; font-size: 0.8em; border-top: 1px solid rgba(0, 242, 255, 0.4); padding-top: 10px; }
        .tx { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid rgba(0, 242, 255, 0.1); }

        /* SIGNATURE MASSIVE EN BAS */
        footer { margin-top: 25px; display: flex; justify-content: space-between; align-items: flex-end; }
        .signature { font-size: 3.5em; font-weight: bold; color: var(--gold); letter-spacing: 15px; text-shadow: 0 0 30px var(--gold); line-height: 0.8; }
    </style>
</head>
<body>

    <canvas id="m"></canvas>
    <div class="vignette"></div>

    <div class="container">
        <div class="terminal">
            <header>
                <div style="font-size: 0.6em; margin-bottom: 5px; opacity: 0.8;">TUESDAY, JANUARY 27, 2026 // 14:49:39 PM</div>
                <div class="title">ARC-314 // CORE</div>
                <div class="meta">GCV: $314,159 | ARCHITECTURE KOSASIH</div>
            </header>

            <div class="engine-zone">
                <div class="engine-box">
                    <label>USD -> PI</label>
                    <input type="number" id="uIn" placeholder="0" oninput="calc()">
                    <div id="pOut" class="res">0.00 Π</div>
                </div>
                <div class="engine-box">
                    <label>PI -> USD</label>
                    <input type="number" id="pIn" placeholder="0" oninput="calc()">
                    <div id="uOut" class="res">$ 0.00</div>
                </div>
            </div>

            <div style="font-size: 0.6em; color: var(--gold); margin-bottom: 5px; font-weight: bold;">>> LIVE_BLOCKCHAIN_STREAM</div>
            <div class="blockchain" id="st"></div>

            <footer>
                <div style="font-size: 0.5em; color: var(--cyan); line-height: 1.6; font-weight: bold;">
                    LOC: KOH SAMUI, TH<br>
                    STATUS: ENCRYPTED<br>
                    PIMAN: INFLUENCE ACTIVE
                </div>
                <div class="signature">ARC314</div>
            </footer>
        </div>
    </div>

    <script>
        const GCV = 314159;
        const c = document.getElementById('m'), x = c.getContext('2d');
        let w = c.width = window.innerWidth, h = c.height = window.innerHeight;
        const columns = Array(Math.floor(w/12)).fill(1);

        function draw() {
            x.fillStyle = "rgba(0, 0, 0, 0.15)";
            x.fillRect(0, 0, w, h);
            x.fillStyle = "#00f2ff";
            x.font = "15px monospace";
            columns.forEach((y, i) => {
                const char = "ARC314π$GLT"[Math.floor(Math.random()*11)];
                x.fillText(char, i * 12, y * 12);
                if (y * 12 > h && Math.random() > 0.98) columns[i] = 0;
                columns[i]++;
            });
        }
        setInterval(draw, 50);

        function calc() {
            const u = document.getElementById('uIn').value;
            const p = document.getElementById('pIn').value;
            document.getElementById('pOut').innerText = (u > 0 ? (u / GCV).toFixed(7) : "0.00") + " Π";
            document.getElementById('uOut').innerText = "$ " + (p > 0 ? (p * GCV).toLocaleString() : "0.00");
        }

        const st = document.getElementById('st');
        function add() {
            const row = `<div class="tx"><span>TX-${Math.random().toString(36).substr(7).toUpperCase()}</span><span style="color:var(--gold)">+${(Math.random()*15).toFixed(4)} Π</span></div>`;
            st.innerHTML = row + st.innerHTML;
            if(st.children.length > 5) st.lastChild.remove();
        }
        setInterval(add, 2000);
    </script>
</body>
</html>
