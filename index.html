<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ARC-314 | ULTRA-INTENSITY MONITOR</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap');
        * { cursor: crosshair !important; user-select: none; box-sizing: border-box; }

        body {
            background-color: #000508; color: #e0f7fa; font-family: 'Orbitron', sans-serif;
            margin: 0; padding: 10px; height: 100vh; overflow: hidden;
            background-image: radial-gradient(circle, rgba(0, 242, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .main-container {
            border: 2px solid #00f2ff; height: 100%; display: flex; flex-direction: column;
            background: rgba(1, 10, 15, 0.95); padding: 15px; box-shadow: inset 0 0 50px rgba(0, 242, 255, 0.2);
        }

        header { display: flex; justify-content: space-between; border-bottom: 2px solid #00f2ff; padding-bottom: 5px; margin-bottom: 10px; }
        .system-status { color: #39ff14; border: 1px solid #39ff14; padding: 2px 12px; font-size: 12px; box-shadow: 0 0 10px #39ff14; }

        .gcv-hero { text-align: center; margin-bottom: 15px; }
        .gcv-value { font-size: 7rem; color: #00f2ff; text-shadow: 0 0 40px #00f2ff; margin: 0; }

        .monitoring-layout { display: grid; grid-template-columns: 1.1fr 1.8fr 1.1fr; gap: 10px; flex-grow: 1; min-height: 0; }

        /* CASE DU MILIEU - FEED TRANSACTIONNEL */
        .blockchain-feed { 
            border: 1px solid #0a4d5c; background: #000; 
            font-family: 'Share Tech Mono', monospace; padding: 5px; 
            overflow: hidden; font-size: 0.85rem; line-height: 1.1;
            height: 100%; display: flex; flex-direction: column;
        }

        .log-entry { color: #15652a; }
        .log-whale { 
            color: #ffcc00 !important; 
            background: rgba(255, 204, 0, 0.15);
            font-weight: bold;
            animation: flash-yellow 0.5s infinite;
            border: 1px solid #ffcc00;
        }

        @keyframes flash-yellow { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

        /* NODES ULTRA-PUISSANTS */
        .node-pulse { fill: #39ff14; filter: drop-shadow(0 0 12px #39ff14) drop-shadow(0 0 25px #39ff14); }

        .map-container { border: 1px solid #0a4d5c; background: #000; position: relative; display: flex; justify-content: center; align-items: center; }
        
        footer { display: flex; justify-content: space-between; color: #ffcc00; font-size: 12px; margin-top: 10px; }
    </style>
</head>
<body onclick="initAudio()">

<div class="main-container">
    <header>
        <div>ARC-314 <span style="font-size: 10px;">CORE</span></div>
        <span class="system-status">ACTIVE MONITORING</span>
    </header>

    <div class="gcv-hero">
        <h1 class="gcv-value">$314,159</h1>
    </div>

    <div class="monitoring-layout">
        <div style="border: 1px solid #bc13fe; padding: 15px; background: rgba(188,19,254,0.05); display: flex; flex-direction: column; justify-content: space-between;">
            <div style="color:#bc13fe; font-weight: bold;">PIMAN PROTOCOL</div>
            <div style="font-size: 0.95rem; line-height: 1.6;">"Laboratory Sealed. Quantum Layer Impenetrable. GCV Locked."</div>
            <div style="color:#00f2ff; border-top: 1px solid #00f2ff; padding-top: 10px; font-weight: bold;">VERDICT: VALIDATED</div>
        </div>

        <div class="blockchain-feed" id="tx-stream"></div>

        <div class="map-container">
            <svg viewBox="0 0 280 150" width="100%">
                <path d="M30,45 L100,60 L70,85 Z M150,35 L220,45 L170,70 Z M50,95 L40,135 Z M200,95 L210,125 Z" fill="none" stroke="rgba(0, 242, 255, 0.3)" stroke-width="1" />
                
                <circle cx="65" cy="50" r="5" class="node-pulse"><animate attributeName="opacity" values="1;0;1" dur="0.4s" repeatCount="indefinite" /></circle>
                <circle cx="185" cy="45" r="5" class="node-pulse"><animate attributeName="opacity" values="0;1;0" dur="0.6s" repeatCount="indefinite" /></circle>
                <circle cx="215" cy="65" r="5" class="node-pulse"><animate attributeName="opacity" values="1;0.2;1" dur="0.3s" repeatCount="indefinite" /></circle>
                <circle cx="70" cy="115" r="5" class="node-pulse"><animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite" /></circle>
            </svg>
            <div style="position: absolute; bottom: 5px; color: #39ff14; font-size: 8px;">GLOBAL SYNC: 100%</div>
        </div>
    </div>

    <footer>
        <span>ARC-314 TERMINAL</span>
        <span>SIGNATURE: ARC314</span>
    </footer>
</div>

<script>
    let audioCtx;
    function initAudio() { if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }

    function playBip() {
        if(!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    }

    const stream = document.getElementById('tx-stream');
    const logs = [
        "BLOCK #12,854,925 [2,400 TPS] -> SEALED",
        "NODE SYNC: GLOBAL CLUSTER -> 100%",
        "PROTOCOL V25 ACTIVE -> QUANTUM SECURE"
    ];

    function addLog() {
        const time = new Date().toLocaleTimeString('en-GB', { hour12: false });
        const isWhale = Math.random() < 0.2;
        const entry = isWhale ? "TX: GC...X4 [314,159.00 PI] -> VALIDATED" : logs[Math.floor(Math.random()*logs.length)];
        
        const div = document.createElement('div');
        div.textContent = `[${time}] ${entry}`;
        div.className = isWhale ? 'log-whale' : 'log-entry';
        
        if(isWhale) playBip();

        stream.prepend(div);
        if(stream.children.length > 45) stream.removeChild(stream.lastChild);
    }

    for(let i=0; i<45; i++) addLog();
    setInterval(addLog, 700);
</script>
</body>
</html>
