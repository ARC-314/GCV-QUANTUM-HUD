<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARC-314 | GCV QUANTUM HUD</title>
    <style>
        body { background-color: #000; color: #00d4ff; font-family: 'Courier New', monospace; margin: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center; }
        #matrix-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.2; }
        header { text-align: center; padding: 20px; border-bottom: 2px solid #FFD700; width: 100%; background: rgba(0, 0, 0, 0.8); box-shadow: 0 0 20px #00d4ff; }
        h1 { color: #FFD700; text-shadow: 0 0 10px #FFD700; margin: 0; letter-spacing: 3px; }
        .main-layout { display: flex; justify-content: space-around; width: 95%; margin-top: 30px; gap: 20px; }
        .panel { background: rgba(0, 20, 50, 0.85); border: 2px solid #FFD700; padding: 20px; flex: 1; min-height: 350px; box-shadow: 0 0 15px #005f73; text-align: center; }
        h3 { color: #FFD700; margin-top: 0; border-bottom: 1px solid #00d4ff; padding-bottom: 10px; }
        input#piAmount { background: #000; border: 1px solid #00d4ff; color: #FFD700; padding: 15px; width: 80%; margin: 20px 0; font-size: 1.5em; text-align: center; border-radius: 5px; }
        #resultUSD { font-weight: bold; font-size: 1.8em; color: #FFD700; text-shadow: 0 0 5px #FFD700; }
        #ticker { height: 250px; overflow: hidden; font-size: 0.85em; text-align: left; }
        .tx-line { padding: 8px 0; border-bottom: 1px solid rgba(0, 212, 255, 0.2); animation: fadeIn 0.5s; }
        .tx-amount { color: #FFD700; font-weight: bold; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        footer { margin-top: auto; padding: 20px; color: #FFD700; font-weight: bold; letter-spacing: 1px; }
    </style>
</head>
<body>
    <canvas id="matrix-bg"></canvas>
    <header>
        <h1>ARC-314 | GCV QUANTUM HUD</h1>
        <p>REAL-TIME BLOCKCHAIN MONITORING - TARGET GCV $314,159</p>
    </header>
    <div class="main-layout">
        <div class="panel">
            <h3>QUANTUM CONVERTER</h3>
            <p>Calculate Pi Value at GCV</p>
            <input type="number" id="piAmount" placeholder="Enter Pi Amount" oninput="calculate()">
            <div id="resultUSD">Total: $0.00 USD</div>
        </div>
        <div class="panel">
            <h3>LIVE BLOCKCHAIN PAYMENTS</h3>
            <div id="ticker">Connecting to Pi Network...</div>
        </div>
    </div>
    <footer>DESIGNED BY ARC-314 | ARCHITECTURE KOKKALIS</footer>
    <script>
        const canvas = document.getElementById('matrix-bg');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const drops = Array(Math.floor(canvas.width/16)).fill(1);
        function draw() {
            ctx.fillStyle = "rgba(0,0,0,0.05)"; ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = "#00d4ff"; ctx.font = "16px monospace";
            drops.forEach((y, i) => {
                ctx.fillText(String.fromCharCode(Math.random()*128), i*16, y*16);
                if(y*16 > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }
        setInterval(draw, 50);

        function calculate() {
            const val = document.getElementById('piAmount').value;
            const gcv = 314159; 
            document.getElementById('resultUSD').innerText = "Total: $" + (val * gcv).toLocaleString(undefined, {minimumFractionDigits: 2}) + " USD";
        }

        async function fetchLiveTX() {
            try {
                const response = await fetch('https://api.mainnet.minepi.com/payments?limit=8&order=desc');
                const data = await response.json();
                const records = data._embedded.records;
                const ticker = document.getElementById('ticker');
                ticker.innerHTML = "";
                records.forEach(tx => {
                    const line = document.createElement('div');
                    line.className = 'tx-line';
                    const from = tx.from.substring(0,6);
                    line.innerHTML = `TX: ${from}... | <span class="tx-amount">${tx.amount} PI</span> | STATUS: <span style="color:#00ff00">GCV TARGET</span>`;
                    ticker.appendChild(line);
                });
            } catch (e) { 
                document.getElementById('ticker').innerText = "Syncing with Blockchain...";
            }
        }
        setInterval(fetchLiveTX, 8000);
        fetchLiveTX();
    </script>
</body>
</html>
