    <title>ARC-314 | QUANTUM CORE</title>
    <style>
        :root { --cyan: #00f2ff; --gold: #FFD700; --panel-bg: rgba(0, 15, 25, 0.85); }
        
        body, html { 
            background: #000; color: var(--cyan); 
            font-family: 'Courier New', monospace; margin: 0; 
            padding: 0; width: 100%; height: 100%; overflow: hidden;
        }

        /* FOND MATRIX SUBTIL */
        #m { position: fixed; top: 0; left: 0; z-index: 1; opacity: 0.2; }

        /* EFFET DE LIGNES HOLOGRAPHIQUES */
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 3px; z-index: 100; pointer-events: none;
        }

        /* CONTENEUR PRINCIPAL */
        .hud-wrapper {
            position: relative; z-index: 10; height: 100vh;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 15px; box-sizing: border-box;
        }

        /* ANNEAUX QUANTIQUES (FIXÉS DERRIÈRE) */
        .quantum-bg {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) rotateX(70deg);
            z-index: 2; pointer-events: none;
        }
        .ring {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            border-radius: 50%; border: 1px solid var(--cyan); animation: spin 15s linear infinite;
        }
        .r1 { width: 350px; height: 350px; border-style: dashed; opacity: 0.3; }
        .r2 { width: 250px; height: 250px; border: 4px double var(--gold); animation-direction: reverse; }

        @keyframes spin { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }

        /* PANNEAUX HOLOGRAPHIQUES */
        .panel {
            background: var(--panel-bg); border: 1px solid var(--cyan);
            padding: 12px; backdrop-filter: blur(10px);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.15);
            position: relative; overflow: hidden;
        }
        .panel::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: var(--gold);
        }
