<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARC-314 | QUANTUM HOLOGRAPHIC HUD</title>
    <style>
        :root {
            --glow-color: #00f2ff;
            --accent-color: #FFD700;
            --laser-color: rgba(0, 242, 255, 0.5);
        }

        body { 
            background-color: #000; 
            color: var(--glow-color); 
            font-family: 'Segoe UI', 'Courier New', monospace; 
            margin: 0; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
        }

        /* MATRIX BG ULTRA-VISIBLE */
        #matrix-bg { 
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%; 
            z-index: -1; 
            opacity: 0.7; 
        }

        /* EFFET LASER SCAN */
        #scan-line {
            position: fixed;
            top: -100px; left: 0;
            width: 100%;
            height: 10px;
            background: var(--glow-color);
            box-shadow: 0 0 20px var(--glow-color), 0 0 40px var(--glow-color);
            z-index: 100;
            opacity: 0;
            pointer-events: none;
        }

        @keyframes scanning {
            0% { top: -10%; opacity: 1; }
            100% { top: 110%; opacity: 1; }
        }

        header { 
            text-align: center; padding: 25px; width: 100%; 
            background: rgba(0, 15, 30, 0.8);
            border-bottom: 3px solid var(--accent-color);
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.4);
            clip-path: polygon(0 0, 100% 0, 95% 100%, 5% 100%);
        }

        .main-layout { 
            display: flex; justify-content: space-around; 
            width: 95%; margin-top: 40px; gap: 30px; z-index: 20;
        }

        .panel { 
            background: rgba(0, 20, 40, 0.7); 
            border: 2px solid var(--glow-color); 
            padding: 25px; flex: 1; min-height: 400px; 
            box-shadow: 0 0 20px var(--glow-color), inset 0 0 10px var(--glow-color);
            border-radius: 0 30px 0 30px;
            backdrop-filter: blur(10px);
        }

        /* BOUTON SCAN */
        .scan-btn {
            background: transparent;
            border: 2px solid var(--accent-color);
            color: var(--accent-color);
            padding: 10px 20px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.3s;
            margin-top: 20px;
            box-shadow: 0 0 10px var(--accent-color);
        }

        .scan-btn:hover {
            background: var(--accent-color);
            color: #000;
            box-shadow: 0 0 30px var(--accent-color);
        }

        input#piAmount { 
            background: rgba(0, 0, 0, 0.8); border: 1px solid var(--glow-color); 
            color: var(--accent-color); padding: 15px; width: 80%; 
            font-size: 1.8em; text-align: center; margin-top: 20px;
        }

        #resultUSD { 
            margin-top: 20px; font-weight: bold; font-size: 2.2em; 
            color: var(--accent-color); text-shadow: 0 0 15px var(--accent-color); 
        }

        .tx-line { 
            padding: 10px; border-left: 4px solid var(--accent-color);
            background: rgba(0, 242, 255, 0.1); margin-bottom: 8px;
            font-size: 0.9em;
        }

        footer { margin-top: auto; padding: 20px; color: var(--accent-color); font-weight: bold; }
    </style>
</head>
<body>

    <div id="scan-line"></div>
    <canvas id="matrix-bg"></canvas>

    <header>
        <h1>ARC-314 | QUANTUM HUD</h1>
        <p>BLOCKCHAIN COMMAND CENTER - GCV $314,159</p>
        <button class="scan-btn" onclick="triggerScan()">Initiate Quantum Scan</button>
    </header>

    <div class="main-layout">
        <div class="panel">
            <h3>GCV CONVERTER</h3>
            <input type="number" id="piAmount" placeholder="PI AMOUNT" oninput="calculate()">
            <div id="resultUSD">$ 0.00</div>
        </div>

        <div class="panel">
            <h3>LIVE NETWORK FEED</h3>
            <div id="ticker">WAITING FOR DATA...</div>
        </div>
    </div>

    <footer>DESIGNED BY ARC-314 | ARCHITECTURE KOKKALIS</footer>

    <script>
        // MATRIX EFFECT
        const canvas = document.getElementById('matrix-bg');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const letters = "01ARC314Π$π#@%";
        const fontSize = 20;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.15)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#00f2ff";
            ctx.font = "bold " + fontSize + "px monospace";
            ctx.shadowBlur = 10; ctx.shadowColor = "#00f2ff";
            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 40);

        // SCAN ANIMATION
        function triggerScan() {
            const line = document.getElementById('scan-line');
            line.style.animation = 'none';
            void line.offsetWidth; // Reset animation
            line.style.animation = 'scanning 2s linear';
            fetchLiveTX(); // On force aussi une mise à jour des données
        }

        // CALCULATOR
        function calculate() {
            const val = document.getElementById('piAmount').value;
            const gcv = 314159; 
            document.getElementById('resultUSD').innerText = "$ " + (val * gcv).toLocaleString(undefined, {minimumFractionDigits: 2});
        }

        // REAL DATA
        async function fetchLiveTX() {
            try {
                const proxy = "https://corsproxy.io/?";
                const target = encodeURIComponent("https://api.mainnet.minepi.com/payments?limit=7&order=desc");
                const response = await fetch(proxy + target);
                const data = await response.json();
                const records = data._embedded.records;
                const ticker = document.getElementById('ticker');
                ticker.innerHTML = "";
                records.forEach(tx => {
                    const line = document.createElement('div');
                    line.className = 'tx-line';
                    line.innerHTML = `NODE: ${tx.from.substring(0,8)}... | <span style="color:#FFD700">${tx.amount} PI</span><br>GCV STATUS: SECURE`;
                    ticker.appendChild(line);
                });
            } catch (e) { console.log("Sync error"); }
        }
        setInterval(fetchLiveTX, 12000);
        fetchLiveTX();
    </script>
</body>
</html>
