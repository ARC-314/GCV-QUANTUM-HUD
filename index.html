<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>ARC-314 | QUANTUM CORE SYSTEM</title>
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-gold: #FFD700;
            --bg-dark: #000810;
        }

        body { 
            background: var(--bg-dark); 
            color: var(--neon-blue); 
            font-family: 'Courier New', monospace; 
            margin: 0; overflow: hidden; height: 100vh;
            perspective: 1200px;
        }

        /* MATRIX BG */
        #matrix-bg { position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.7; }

        /* --- L'ANNEAU HOLOGRAPHIQUE ULTRA-VISIBLE --- */
        .ring-container {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) rotateX(75deg);
            z-index: 1;
        }

        /* Premier anneau épais */
        .ring {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border: 8px double var(--neon-blue);
            border-radius: 50%;
            box-shadow: 0 0 60px var(--neon-blue), inset 0 0 40px var(--neon-blue);
            animation: rotateRing 8s linear infinite;
        }

        .ring-large { width: 650px; height: 650px; border-width: 12px; opacity: 0.8; }
        .ring-inner { width: 500px; height: 500px; border: 4px dashed var(--neon-gold); animation-duration: 4s; opacity: 0.6; }

        @keyframes rotateRing { 
            from { transform: translate(-50%, -50%) rotate(0deg); } 
            to { transform: translate(-50%, -50%) rotate(360deg); } 
        }

        /* --- INTERFACE --- */
        header {
            width: 100%; padding: 25px; text-align: center;
            background: rgba(0, 0, 0, 0.9);
            border-bottom: 4px solid var(--neon-gold);
            box-shadow: 0 0 40px rgba(0, 242, 255, 0.5);
            position: relative; z-index: 50;
        }

        h1 { margin: 0; font-size: 3.2em; color: var(--neon-gold); text-shadow: 0 0 25px var(--neon-gold); letter-spacing: 15px; }

        .hud-container {
            display: flex; justify-content: space-around;
            padding: 40px; gap: 40px; z-index: 10; position: relative;
        }

        .panel {
            background: rgba(0, 15, 30, 0.85);
            border: 2px solid var(--neon-blue);
            padding: 30px; width: 450px;
            box-shadow: 0 0 35px rgba(0, 242, 255, 0.4);
            clip-path: polygon(10% 0, 100% 0, 100% 90%, 90% 100%, 0 100%, 0 10%);
            backdrop-filter: blur(12px);
        }

        h3 { color: var(--neon-gold); border-bottom: 2px solid var(--neon-blue); padding-bottom: 10px; text-transform: uppercase; font-size: 1.4em; }

        input {
            background: rgba(0, 0, 0, 0.9); border: 2px solid var(--neon-blue);
            color: var(--neon-gold); width: 90%; padding: 15px; font-size: 2.2em;
            text-align: center; margin-top: 20px; outline: none;
            box-shadow: inset 0 0 20px var(--neon-blue);
        }

        #resultUSD { font-size: 3em; color: var(--neon-gold); margin-top: 20px; text-shadow: 0 0 20px var(--neon-gold); font-weight: bold; }

        #ticker { height: 350px; overflow: hidden; font-size: 1em; }
        
        .tx-line { 
            padding: 12px; border-bottom: 1px solid rgba(0, 242, 255, 0.3); 
            color: var(--neon-blue); text-shadow: 0 0 5px var(--neon-blue);
        }

        footer {
            position: fixed; bottom: 0; width: 100%; padding: 20px;
            background: rgba(0,0,0,0.95); color: var(--neon-gold);
            text-align: center; font-size: 1em; letter-spacing: 4px; font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="ring-container">
        <div class="ring ring-large"></div>
        <div class="ring ring-inner"></div>
    </div>
    
    <canvas id="matrix-bg"></canvas>

    <header>
        <h1>ARC-314 QUANTUM CORE</h1>
        <div style="color:var(--neon-blue); font-weight: bold; letter-spacing: 3px;">TERMINAL GCV $314,159 | LIVE UPLINK</div>
    </header>

    <div class="hud-container">
        <div class="panel">
            <h3>[ CONVERTER ]</h3>
            <input type="number" id="piAmount" placeholder="PI VOLUME" oninput="calculate()">
            <div id="resultUSD">$ 0.00</div>
        </div>

        <div class="panel">
            <h3>[ MAINNET FEED ]</h3>
            <div id="ticker">CONNECTING...</div>
        </div>
    </div>

    <footer>
        DESIGNED BY ARC-314 | ARCHITECTURE BY KOKKALIS
    </footer>

    <script>
        const canvas = document.getElementById('matrix-bg');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const letters = "01ARC314Π$π!#%&*";
        const fontSize = 20;
        const drops = Array(Math.floor(canvas.width / fontSize)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.15)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#00f2ff";
            ctx.font = "bold " + fontSize + "px monospace";
            drops.forEach((y, i) => {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, y * fontSize);
                if (y * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }
        setInterval(drawMatrix, 45);

        function calculate() {
            const val = document.getElementById('piAmount').value;
            const total = val * 314159;
            document.getElementById('resultUSD').innerText = "$ " + total.toLocaleString(undefined, {minimumFractionDigits: 2});
        }

        async function fetchLiveTX() {
            try {
                const response = await fetch('https://corsproxy.io/?' + encodeURIComponent('https://api.mainnet.minepi.com/payments?limit=7&order=desc'));
                const data = await response.json();
                const ticker = document.getElementById('ticker');
                ticker.innerHTML = "";
                data._embedded.records.forEach(tx => {
                    const line = document.createElement('div');
                    line.className = 'tx-line';
                    line.innerHTML = `> TX: ${tx.from.substring(0,8)} | <span style="color:var(--neon-gold)">${tx.amount} PI</span>`;
                    ticker.appendChild(line);
                });
            } catch (e) { }
        }
        setInterval(fetchLiveTX, 10000);
        fetchLiveTX();
    </script>
</body>
</html>
