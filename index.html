<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARC-314 | QUANTUM CORE</title>
    <style>
        :root { --cyan: #00f2ff; --gold: #FFD700; --bg: #000; }
        body, html { background: var(--bg); color: var(--cyan); font-family: 'Courier New', monospace; margin: 0; padding: 0; overflow: hidden; height: 100vh; }

        /* MATRIX DYNAMIQUE - OPTIMISÉE POUR MOBILE */
        canvas { position: fixed; top: 0; left: 0; z-index: 1; opacity: 0.7; }

        /* CALQUE DE PROTECTION ANTI-LAG */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.85) 100%);
            z-index: 2; pointer-events: none;
        }

        /* TERMINAL ARC-314 */
        .hud {
            position: relative; z-index: 10; height: 100vh;
            display: flex; flex-direction: column; padding: 10px; box-sizing: border-box;
            justify-content: space-between;
        }

        .main-unit {
            border: 2px solid var(--cyan); background: rgba(0, 5, 10, 0.9);
            padding: 15px; box-shadow: 0 0 20px rgba(0, 242, 255, 0.3);
        }

        header { border-bottom: 2px solid var(--gold); margin-bottom: 10px; padding-bottom: 5px; }
        .title { font-size: 1.3em; font-weight: bold; color: var(--gold); letter-spacing: 3px; }
