<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARC-314 | GCV QUANTUM HUD</title>
    <style>
        :root {
            --quantum-blue: #00f2ff;
            --quantum-gold: #FFD700;
            --bg-dark: #00050a;
            --panel-bg: rgba(0, 10, 20, 0.85);
        }

        body { 
            background: var(--bg-dark); 
            color: var(--quantum-blue); 
            font-family: 'Courier New', monospace; 
            margin: 0; overflow-x: hidden; height: 100vh;
            perspective: 1200px;
        }

        /* MATRIX BACKGROUND */
        #matrix-bg { position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.5; }

        /* QUANTUM CORE RINGS */
        .core-container {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%) rotateX(70deg);
            z-index: 0; pointer-events: none;
        }
        .ring {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            border-radius: 50%; border: 2px solid var(--quantum-blue);
            box-shadow: 0 0 40px var(--quantum-blue), inset 0 0 20px var(--quantum-blue);
            animation: rotate 10s linear infinite;
        }
        .r1 { width: 600px; height: 600px; border-style: dashed; opacity: 0.3; }
        .r2 { width: 450px; height: 450px; border: 6px double var(--quantum-gold); animation-duration: 15s; animation-direction: reverse; }
        .r3 { width: 200px; height: 200px; box-shadow: 0 0 80px var(--quantum-blue); }

        @keyframes rotate { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }

        /* INTERFACE */
        header {
            text-align: center; padding: 20px; background: rgba(0,0,0,0.9);
            border-bottom: 3px solid var(--quantum-gold); position: relative; z-index: 100;
        }

        h1 { margin: 0; font-size: 2.5em; color: var(--quantum-gold); letter-spacing: 10px; text-shadow: 0 0 15px var(--quantum-gold); }

        .main-container {
            display: grid; grid-template-columns: 400px 1fr 400px;
            padding: 30px; gap: 20px; position: relative; z-index: 50;
        }

        .panel {
            background: var(--panel-bg); border: 1px solid var(--quantum-blue);
            padding: 20px; backdrop-filter: blur(10px);
            clip-path: polygon(10% 0, 100% 0, 100% 90%, 90% 100%, 0 100%, 0 10%);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
        }

        h3 { color: var(--quantum-gold); border-bottom: 1px solid var(--quantum-blue); padding-bottom: 5px; text-transform: uppercase; }

        input {
            background: #000; border: 1px solid var(--quantum-gold);
            color: var(--quantum-gold); width: 100%; padding: 12px;
            font-size: 1.5em; text-align: center; outline: none; margin-top: 10px;
            box-sizing: border-box; box-shadow: inset 0 0 10px var(--quantum-gold);
        }

        .result-display {
            font-size: 2em; color: var(--quantum-gold); font-weight: bold;
            text-align: center; margin-top: 15px; text-shadow: 0 0 10px var(--quantum-gold);
        }

        #ticker { height: 300px; overflow: hidden; font-size: 0.8em; margin-top: 10px; }
        .tx-line { border-bottom: 1px solid rgba(0, 242, 255, 0.1); padding: 8px 0; display: flex; justify-content: space-between; }

        footer {
            position: fixed; bottom: 0; width: 100%; padding: 15px;
            background: rgba(0,0,0,0.9); color: var(--quantum-gold);
            text-align: center; font-size: 0.9em; letter-spacing: 3px; z-index: 100;
        }

        /* RESPONSIVE */
        @media (max-width: 1100px) {
            .main-container { grid-template-columns: 1fr; }
            .core-container { display: none; }
        }
    </style>
</head>
<body>

    <div class="core-container">
        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <div class="ring r3"></div>
    </div>
    
    <canvas id="matrix-bg"></canvas>

    <header>
        <h1>ARC-314 QUANTUM HUD</h1>
        <div style="color:var(--quantum-blue); font-weight:bold;">GCV PROTOCOL $314,159 | KOSASIH ARCHITECTURE</div>
    </header>

    <div class="main-container">
        <div class="panel">
            <h3>[ GCV MICRO-PAY ]</h3>
            <p style="font-size: 0.8em;">ENTREZ PRIX EN DOLLARS ($) :</p>
            <input type="number" id="fiatInput" placeholder="Ex: 10.00" oninput="calculate()">
            <p style="font-size: 0.8em; margin-top: 20px;">MONTANT REQUIS EN PI :</p>
            <div id="piResult" class="result-display">0.00000000 Π</div>
            <p style="font-size: 0.6em; margin-top: 15px; opacity: 0.7;">
                CALCUL SUR BASE GCV CONSENSUS<br>NETWORK FEE: 0.01 Π
            </p>
        </div>

        <div></div>

        <div class="panel">
