<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARC-314 | QUANTUM INTERFACE</title>
    <style>
        :root { --neon: #00f2ff; --gold: #FFD700; }
        body, html { background: #000; color: var(--neon); font-family: 'Courier New', monospace; margin: 0; padding: 0; overflow: hidden; height: 100vh; }

        /* MATRIX BACKGROUND */
        canvas { position: fixed; top: 0; left: 0; z-index: 1; opacity: 0.7; }

        /* HUD WRAPPER AVEC PERSPECTIVE */
        .viewport {
            position: relative; z-index: 10; height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.9) 100%);
            perspective: 800px;
        }

        /* LE TERMINAL (INCLINÉ COMME SUR L'IMAGE) */
        .terminal {
            width: 90%; max-width: 450px;
            background: rgba(0, 15, 25, 0.9);
            border: 2px solid var(--neon);
            padding: 20px;
            transform: rotateY(-10deg) rotateX(5deg);
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.5), inset 0 0 15px rgba(0, 242, 255, 0.3);
            border-radius: 4px;
        }

        header { border-bottom: 2px solid var(--gold); margin-bottom: 15px; padding-bottom: 10px; }
        .title { font-size: 1.4em; font-weight: bold; color: var(--gold); letter-spacing: 3px; text-shadow: 0 0 10px var(--gold); }

        /* CALCULATEUR DUAL-ENGINE GCV */
        .engine-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .engine-box { background: rgba(0,0,0,0.7); border: 1px solid var(--neon); padding: 10px; text-align: center; }
        label { font-size: 0.6em; color: var(--gold); display: block; margin-bottom: 5px; }
        input { background: transparent; border: none; border-bottom: 1px solid var(--gold); color: var(--gold); width: 100%; font-size: 1.3em; text-align: center; outline: none; }
        .res { font-size: 1.1em; font-weight: bold; color: var(--gold); margin-top: 5px; }

        /* LIVE STREAM */
        .stream { height: 100px; overflow: hidden; font-size: 0.7em; border-top: 1px solid rgba(0,242,255,0.2); padding-top: 10px; }
        .tx { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(0,242,255,0.05); padding: 4px 0; }

        footer { margin-top: 15px; display: flex; justify-content: space-between; align-items: flex-end; }
        .sig { font-size: 2.5em; font-weight: bold; color: var(--gold); letter-spacing: 10px; text-shadow: 0 0 20px var(--gold); }
    </style>
</head>
<body>

<canvas id="m"></canvas>

<div class="viewport">
    <div class="terminal">
        <header>
            <div class="title">ARC-314 // CORE</div>
            <div style="font-size: 0.6em;">GCV: $314,159 | PROTOCOL GLT-314</div>
        </header>

        <div class="engine-container">
            <div class="engine-box">
                <label>USD -> PI</label>
                <input type="number" id="usdIn" placeholder="0" oninput="calcToPi()">
                <div id="piOut" class="res">0.00 Π</div>
            </div>
            <div class="engine-box">
                <label>PI -> USD</label>
                <input type="number" id="piIn" placeholder="0" oninput="calcToUsd()">
                <div id="usdOut" class="res">$ 0.00</div>
            </div>
        </div>

        <div style="font-size: 0.6em; color: var(--gold); margin-bottom: 5px;">>> LIVE_BLOCKCHAIN_STREAM</div>
        <div class="stream" id="st"></div>

        <footer>
            <div style="font-size: 0.5em; line-height: 1.4;">
                LOC: TH_SANCTUARY<br>
                STATUS: ENCRYPTED<br>
                PIMAN: ACTIVE
            </div>
            <div class="sig">ARC314</div>
        </footer>
    </div>
</div>

<script>
    const c = document.getElementById('m'), x = c.getContext('2d');
    let w = c.width = window.innerWidth, h = c.height = window.innerHeight;
    const d = Array(Math.floor(w/20)).fill(1);
    const GCV = 314159;

    function draw() {
        x.fillStyle = "rgba(0,0,0,0.15)"; x.fillRect(0,0,w,h);
        x.fillStyle = "#00f2ff"; x.font = "16px monospace";
        d.forEach((y, i) => {
            x.fillText("ARC314π$GLT"[Math.floor(Math.random()*11)], i*20, y*20);
            if(y*20 > h && Math.random() > 0.98) d[i] = 0; d[i]++;
        });
    }
    setInterval(draw, 50);

    function calcToPi() {
        const v = document.getElementById('usdIn').value;
        document.getElementById('piOut').innerText = (v > 0 ? (v / GCV).toFixed(7) : "0.00") + " Π";
    }

    function calcToUsd() {
        const v = document.getElementById('piIn').value;
        document.getElementById('usdOut').innerText = "$ " + (v > 0 ? (v * GCV).toLocaleString() : "0.00");
    }

    const st = document.getElementById('st');
    function addTx() {
        const id = "TX-" + Math.random().toString(36).substr(7).toUpperCase();
        const amt = (Math.random() * 10).toFixed(4);
        st.innerHTML = `<div class="tx"><span>${id}</span><span style="color:var(--gold)">${amt} Π</span></div>` + st.innerHTML;
        if(st.children.length > 5) st.lastChild.remove();
    }
    setInterval(addTx, 2000);
</script>

</body>
</html>
