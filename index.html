<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARC-314 | QUANTUM HUD</title>
    <style>
        :root { --blue: #00f2ff; --gold: #FFD700; }
        body { background: #000205; color: var(--blue); font-family: 'Courier New', monospace; margin: 0; overflow: hidden; height: 100vh; perspective: 1000px; }
        
        /* MATRIX BACKGROUND */
        #m { position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.5; }

        /* QUANTUM RINGS */
        .core { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotateX(60deg); z-index: 0; pointer-events: none; }
        .ring { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border-radius: 50%; border: 2px solid var(--blue); animation: rot 10s linear infinite; }
        .r1 { width: 600px; height: 600px; border-style: dashed; opacity: 0.3; }
        .r2 { width: 400px; height: 400px; border: 4px double var(--gold); animation-direction: reverse; animation-duration: 15s; }
        @keyframes rot { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }

        /* HUD */
        header { width: 100%; padding: 20px; text-align: center; background: rgba(0, 15, 30, 0.9); border-bottom: 2px solid var(--gold); position: relative; z-index: 10; }
        .main { display: grid; grid-template-columns: 350px 1fr 350px; padding: 20px; gap: 20px; position: relative; z-index: 5; }
        .panel { background: rgba(0, 10, 25, 0.85); border: 1px solid var(--blue); padding: 20px; backdrop-filter: blur(10px); }
        
        input { background: #000; border: 1px solid var(--gold); color: var(--gold); width: 100%; padding: 12px; font-size: 1.5em; text-align: center; box-sizing: border-box; }
        .val { font-size: 2em; color: var(--gold); text-align: center; font-weight: bold; margin-top: 10px; }

        footer { position: fixed; bottom: 0; width: 100%; padding: 10px; background: rgba(0,0,0,0.9); color: var(--gold); text-align: center; border-top: 1px solid var(--gold); font-size: 0.8em; letter-spacing: 3px; }
    </style>
</head>
<body>
    <canvas id="m"></canvas>
    <div class="core"><div class="ring r1"></div><div class="ring r2"></div></div>

    <header>
        <h1 style="margin:0; letter-spacing:8px; font-size: 1.5em;">ARC-314 PROCESSOR</h1>
        <div style="font-size: 0.7em;">CONSENSUS GCV: $314,159 | KOSASIH ARCHITECTURE</div>
    </header>

    <div class="main">
