<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARC-314 | QUANTUM CORE</title>
    <style>
        :root { --cyan: #00f2ff; --gold: #FFD700; --glow: rgba(0, 242, 255, 0.5); }
        body, html { background: #000; color: var(--cyan); font-family: 'Courier New', monospace; margin: 0; padding: 0; overflow: hidden; height: 100vh; }

        /* MATRIX DENSE EN ARRIÈRE-PLAN */
        canvas { position: fixed; top: 0; left: 0; z-index: 1; opacity: 0.7; }

        /* VIGNETTE ET SCANLINES POUR LE LOOK ÉCRAN */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 10%, rgba(0,0,0,0.85) 100%),
                        repeating-linear-gradient(0deg, rgba(0,0,0,0.1) 0px, rgba(0,0,0,0.1) 1px, transparent 1px, transparent 2px);
            z-index: 5; pointer-events: none;
        }

        .scene {
            position: relative; z-index: 10; height: 100vh;
            display: flex; align-items: center; justify-content: center;
            perspective: 1200px; /* Profondeur 3D */
        }

        /* LE TERMINAL ARC-314 AVEC LES COINS COUPÉS EXACTS */
        .terminal {
            width: 90%; max-width: 500px;
            background: rgba(0, 15, 25, 0.85);
            backdrop-filter: blur(5px);
            border: 1px solid var(--cyan);
            box-shadow: 0 0 30px var(--glow), inset 0 0 15px var(--glow);
            padding: 30px;
            transform: rotateY(-12deg) rotateX(5deg); /* Inclinaison image */
            clip-path: polygon(8% 0, 100% 0, 100% 92%, 92% 100%, 0 100%, 0 8%);
        }

        header { border-bottom: 1px solid var(--gold); margin-bottom: 20px; padding-bottom: 10px; position: relative; }
        .title { font-size: 1.6em; font-weight: bold; color: var(--gold); text-shadow: 0 0 15px var(--gold); letter-spacing: 3px; }
        .subtitle { font-size: 0.6em; color: var(--cyan); letter-spacing: 1px; }

        /* LES BOÎTES MOTEURS (SEARCH) AVEC LES COINS COUPÉS */
        .dual-engine { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .engine-box {
            background: rgba(0, 242, 255, 0.05);
            border: 1px solid var(--cyan);
            padding: 15px;
            clip-path: polygon(0 0, 100% 0, 100% 75%, 85% 100%, 0 100%);
            box-shadow: inset 0 0 10px var(--glow);
            text-align: center;
        }

        label { font-size: 0.55em; color: var(--gold); display: block; margin-bottom: 8px; font-weight: bold; }
        input { 
            background: transparent; border: none; border-bottom: 1px solid var(--gold); 
            color: var(--gold); width: 85%; font-size: 1.4em; text-align: center; outline: none; font-weight: bold;
        }
        .res { font-size: 1.1em; font-weight: bold; color: var(--gold); margin-top: 10px; text-shadow: 0 0 5px var(--gold); }

        /* BLOCKCHAIN FEED */
        .stream { height: 100px; overflow: hidden; font-size: 0.7em; border-top: 1px solid rgba(0, 242, 255, 0.3); padding-top: 10px; }
        .tx { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid rgba(0, 242, 255, 0.05); }

        footer { margin-top: 25px; display: flex; justify-content: space-between; align-items: flex-end; }
        .signature { font-size: 3em; font-weight: bold; color: var(--gold); letter-spacing: 10px; text-shadow: 0 0 25px var(--gold); line-height: 1; }
    </style>
</head>
