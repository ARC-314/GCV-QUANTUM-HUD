<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARC-314 | CORE</title>
    <style>
        body, html { background: #000; margin: 0; padding: 0; overflow: hidden; height: 100vh; font-family: monospace; }
        #c { position: fixed; top: 0; left: 0; z-index: 1; }
        
        /* Interface de saisie ultra-simple pour éviter les bugs */
        .ui-layer {
            position: relative; z-index: 10; height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            pointer-events: none;
        }
        .input-wrap {
            pointer-events: auto; background: rgba(0, 20, 30, 0.8);
            border: 2px solid #00f2ff; padding: 20px; width: 85%; max-width: 400px;
            box-shadow: 0 0 20px #00f2ff;
        }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        input { 
            background: #000; border: 1px solid #FFD700; color: #FFD700; 
            width: 100%; text-align: center; font-size: 1.2em; padding: 5px 0; outline: none;
        }
        label { color: #FFD700; font-size: 0.7em; display: block; margin-bottom: 5px; }
        .res { color: #FFD700; font-weight: bold; margin-top: 5px; font-size: 0.9em; text-align: center; }
        .sig-text { color: #FFD700; font-size: 3em; font-weight: bold; letter-spacing: 10px; margin-top: 20px; text-shadow: 0 0 15px #FFD700; }
    </style>
</head>
<body>

<canvas id="c"></canvas>

<div class="ui-layer">
    <div class="input-wrap">
        <div style="color:#FFD700; border-bottom: 1px solid #FFD700; padding-bottom: 5px; margin-bottom: 10px; font-weight: bold;">
            ARC-314 // GCV ENGINE
        </div>
        
        <div class="row">
            <div>
                <label>SEARCH USD</label>
                <input type="number" id="uIn" placeholder="0" oninput="calc()">
                <div id="pOut" class="res">0.00 Π</div>
            </div>
            <div>
                <label>SEARCH PI</label>
                <input type="number" id="pIn" placeholder="0" oninput="calc()">
                <div id="uOut" class="res">$ 0.00</div>
            </div>
        </div>

        <div style="font-size: 0.6em; color: #00f2ff; line-height: 1.4;">
            ARCHITECTURE: KOSASIH<br>
            LOC: KOH SAMUI, TH<br>
            STATUS: ACTIVE
        </div>
    </div>
    <div class="sig-text">ARC314</div>
</div>

<script>
    const GCV = 314159;
    const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
    let w, h, cols;

    function init() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        cols = Array(Math.floor(w / 15)).fill(0);
    }

    function draw() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.1)";
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = "#00f2ff";
        ctx.font = "15px monospace";

        cols.forEach((y, i) => {
            const char = "ARC314π$GLT"[Math.floor(Math.random() * 11)];
            ctx.fillText(char, i * 15, y);
            if (y > h && Math.random() > 0.975) cols[i] = 0;
            else cols[i] += 15;
        });
    }

    function calc() {
        const u = document.getElementById('uIn').value;
        const p = document.getElementById('pIn').value;
        document.getElementById('pOut').innerText = (u > 0 ? (u / GCV).toFixed(7) : "0.00") + " Π";
        document.getElementById('uOut').innerText = "$ " + (p > 0 ? (p * GCV).toLocaleString() : "0.00");
    }

    window.addEventListener('resize', init);
    init();
    setInterval(draw, 50);
</script>

</body>
</html>
