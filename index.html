<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARC-314 | TRUE CORE</title>
    <style>
        :root { --neon: #00f2ff; --gold: #FFD700; --glow: rgba(0, 242, 255, 0.6); }
        body, html { background: #000; margin: 0; padding: 0; overflow: hidden; height: 100vh; font-family: 'Courier New', monospace; }

        /* 1. FOND MATRIX ULTRA-DENSE */
        #m { position: fixed; top: 0; left: 0; z-index: 1; filter: brightness(0.8); }

        /* 2. EFFET DE PROFONDEUR ET LUEUR BLEUE (VIGNETTE) */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 10%, rgba(0, 242, 255, 0.15) 50%, rgba(0,0,0,0.9) 100%);
            z-index: 2; pointer-events: none;
        }

        /* 3. PERSPECTIVE 3D DU TERMINAL */
        .scene {
            position: relative; z-index: 10; height: 100vh;
            display: flex; align-items: center; justify-content: center;
            perspective: 1200px;
        }

        .terminal {
            width: 92%; max-width: 460px;
            background: rgba(0, 8, 15, 0.95);
            border: 3px solid var(--neon);
            box-shadow: 0 0 40px var(--glow), inset 0 0 20px var(--glow);
            padding: 25px;
            transform: rotateY(-8deg) rotateX(4deg); /* L'inclinaison exacte de l'image */
            border-radius: 5px;
            position: relative;
        }

        /* DÉTAILS TECHNIQUES (LES PETITS TEXTES) */
        .tech-info { font-size: 0.55em; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; opacity: 0.8; }
        
        header { border-bottom: 2px solid var(--gold); margin-bottom: 15px; padding-bottom: 10px; }
        .title { font-size: 1.7em; font-weight: bold; color: var(--gold); text-shadow: 0 0 15px var(--gold); letter-spacing: 2px; }
