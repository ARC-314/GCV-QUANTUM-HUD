<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARC-314 // KOKKALIS & KOSASIH</title>
    <style>
        :root { 
            --neon: #00f2ff; 
            --gold: #FFD700; 
            --neon-glow: 0 0 10px rgba(0, 242, 255, 0.6);
            --gold-glow: 0 0 12px rgba(255, 215, 0, 0.7);
        }
        
        body, html { background: #000; color: var(--neon); font-family: 'Courier New', monospace; margin: 0; padding: 0; overflow: hidden; height: 100vh; }
        canvas { position: fixed; top: 0; left: 0; z-index: 1; opacity: 0.7; }

        .container {
            position: relative; z-index: 10; height: 100vh;
            display: flex; align-items: center; justify-content: center; padding: 10px;
        }

        .terminal {
            width: 95%; max-width: 700px;
            background: rgba(0, 5, 10, 0.96);
            border: 2px solid var(--neon);
            box-shadow: var(--neon-glow);
            padding: 40px;
        }

        header { border-bottom: 2px solid var(--gold); margin-bottom: 25px; padding-bottom: 15px; }
        .title { font-size: 2.2em; font-weight: bold; color: var(--gold); text-shadow: var(--gold-glow); letter-spacing: 4px; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        .box { border: 1px solid var(--neon); background: #000; padding: 25px; text-align: center; }
        
        label { font-size: 0.7em; color: var(--gold); display: block; margin-bottom: 8px; font-weight: bold; }
        input { 
            background: transparent; border: none; border-bottom: 1px solid var(--gold); 
            color: var(--gold); width: 90%; font-size: 2em; text-align: center; outline: none;
            text-shadow: var(--gold-glow);
        }
        .res { font-size: 1.5em; font-weight: bold; color: var(--gold); margin-top: 15px; }

        .stream { height: 100px; overflow: hidden; font-size: 0.8em; border-top: 1px solid rgba(0,242,255,0.3); padding-top: 15px; color: #fff; }

        /* NOUVEAU FOOTER : DESIGN ÉPURÉ */
        footer { 
            margin-top: 35px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-top: 1px solid var(--gold);
            padding-top: 20px;
        }

        .status-info { font-size: 0.6em; line-height: 1.5; color: var(--neon); }
        
        .brand-seal { text-align: center; display: flex; align-items: center; gap: 20px; }
        .brand-name { font-size: 1.1em; font-weight: bold; color: var(--gold); letter-spacing: 2px; text-shadow: var(--gold-glow); }
        .pi-main { font-size: 3.5em; color: var(--gold); text-shadow: var(--gold-glow); line-height: 0.8; }
    </style>
</head>
<body>

<canvas id="m"></canvas>

<div class="container">
    <div class="terminal">
        <header>
            <div style="font-size: 0.6em; margin-bottom: 5px;">SYSTEM: ARC-314 // JAN-2026</div>
            <div class="title">ARC-314 // CORE</div>
            <div style="font-size: 0.7em; font-weight: bold; color: var(--neon);">GLOBAL CONSENSUS: $314,159</div>
        </header>

        <div class="grid">
            <div class="box">
                <label>SEARCH USD</label>
                <input type="number" id="uIn" placeholder="0" oninput="calc()">
                <div id="pOut" class="res">0.00 Π</div>
            </div>
            <div class="box">
                <label>SEARCH PI</label>
                <input type="number" id="pIn" placeholder="0" oninput="calc()">
                <div id="uOut" class="res">$ 0.00</div>
            </div>
        </div>

        <div class="stream" id="st"></div>

        <footer>
            <div class="status-info">
                STATUS: ENCRYPTED<br>
                PIMAN: ONLINE<br>
                LOC: [PROTECTED]
            </div>
            <div class="brand-seal">
                <div class="brand-name">KOKKALIS</div>
                <div class="pi-main">π</div>
                <div class="brand-name">KOSASIH</div>
            </div>
        </footer>
    </div>
</div>

<script>
    const GCV = 314159;
    const canvas = document.getElementById('m'), ctx = canvas.getContext('2d');
    let w, h, columns;

    function init() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        columns = Array(Math.floor(w/20)).fill(1);
    }

    function draw() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.15)";
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = "#00f2ff";
        ctx.font = "15px monospace";
        columns.forEach((y, i) => {
            const char = "ARC314π$GLT"[Math.floor(Math.random()*11)];
            ctx.fillText(char, i * 20, y * 20);
            if (y * 20 > h && Math.random() > 0.98) columns[i] = 0;
            columns[i]++;
        });
    }

    window.addEventListener('resize', init);
    init();
    setInterval(draw, 50);

    function calc() {
        const u = document.getElementById('uIn').value;
        const p = document.getElementById('pIn').value;
        document.getElementById('pOut').innerText = (u > 0 ? (u / GCV).toFixed(7) : "0.00") + " Π";
        document.getElementById('uOut').innerText = "$ " + (p > 0 ? (p * GCV).toLocaleString() : "0.00");
    }

    const st = document.getElementById('st');
    function addTx() {
        const row = `<div style="display:flex; justify-content:space-between; padding:4px 0;"><span>ID-${Math.random().toString(36).substr(7).toUpperCase()}</span><span style="color:var(--gold)">+${(Math.random()*10).toFixed(4)} Π</span></div>`;
        st.innerHTML = row + st.innerHTML;
        if(st.children.length > 4) st.lastChild.remove();
    }
    setInterval(addTx, 2000);
</script>

</body>
</html>
