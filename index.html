<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARC-314 | GCV QUANTUM HUD</title>
    <style>
        body { 
            background-color: #000; 
            color: #00d4ff; 
            font-family: 'Courier New', monospace; 
            margin: 0; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }

        /* FOND MATRIX PLUS VOYANT */
        #matrix-bg { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: -1; 
            opacity: 0.6; /* Visibilité augmentée */
        }

        header { 
            text-align: center; 
            padding: 20px; 
            border-bottom: 2px solid #FFD700; 
            width: 100%; 
            background: rgba(0, 0, 0, 0.9); 
            box-shadow: 0 0 25px #00d4ff; 
        }

        h1 { 
            color: #FFD700; 
            text-shadow: 0 0 15px #FFD700; 
            margin: 0; 
            letter-spacing: 4px; 
        }

        .main-layout { 
            display: flex; 
            justify-content: space-around; 
            width: 95%; 
            margin-top: 30px; 
            gap: 20px; 
        }

        .panel { 
            background: rgba(0, 10, 30, 0.9); 
            border: 2px solid #FFD700; 
            padding: 20px; 
            flex: 1; 
            min-height: 380px; 
            box-shadow: 0 0 20px #005f73; 
            text-align: center;
            backdrop-filter: blur(5px);
        }

        h3 { color: #FFD700; margin-top: 0; border-bottom: 1px solid #00d4ff; padding-bottom: 10px; }

        input#piAmount { 
            background: #000; 
            border: 1px solid #00d4ff; 
            color: #FFD700; 
            padding: 15px; 
            width: 80%; 
            margin: 20px 0; 
            font-size: 1.8em; 
            text-align: center; 
            box-shadow: inset 0 0 10px #00d4ff;
        }

        #resultUSD { 
            font-weight: bold; 
            font-size: 2.2em; 
            color: #FFD700; 
            text-shadow: 0 0 10px #FFD700; 
        }

        #ticker { 
            height: 280px; 
            overflow: hidden; 
            font-size: 0.9em; 
            text-align: left; 
        }

        .tx-line { 
            padding: 10px 0; 
            border-bottom: 1px solid rgba(0, 212, 255, 0.3); 
            animation: fadeIn 0.4s;
            text-shadow: 0 0 5px #00d4ff;
        }

        .tx-amount { color: #FFD700; font-weight: bold; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        footer { 
            margin-top: auto; 
            padding: 20px; 
            color: #FFD700; 
            font-weight: bold; 
            text-shadow: 0 0 5px #000;
        }
    </style>
</head>
<body>

    <canvas id="matrix-bg"></canvas>

    <header>
        <h1>ARC-314 | GCV QUANTUM HUD</h1>
        <p>REAL-TIME BLOCKCHAIN MONITORING - TARGET GCV $314,159</p>
    </header>

    <div class="main-layout">
        <div class="panel">
            <h3>QUANTUM CONVERTER</h3>
            <p>Calculate Pi Value at GCV</p>
            <input type="number" id="piAmount" placeholder="Amount of Pi" oninput="calculate()">
            <div id="resultUSD">Value: $0.00 USD</div>
        </div>

        <div class="panel">
            <h3>LIVE BLOCKCHAIN PAYMENTS</h3>
            <div id="ticker">Connecting to Pi Network...</div>
        </div>
    </div>

    <footer>DESIGNED BY ARC-314 | ARCHITECTURE KOKKALIS</footer>

    <script>
        // --- EFFET MATRIX AMÉLIORÉ ---
        const canvas = document.getElementById('matrix-bg');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const letters = "0123456789ARC314Π$π";
        const fontSize = 18;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.15)"; // Traînées plus marquées
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#00f2ff"; // Bleu plus éclatant
            ctx.font = fontSize + "px monospace";
            ctx.shadowBlur = 8; // Effet de lueur
            ctx.shadowColor = "#00d4ff";

            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 40); // Plus fluide

        // --- CALCULATEUR ---
        function calculate() {
            const val = document.getElementById('piAmount').value;
            const gcv = 314159; 
            document.getElementById('resultUSD').innerText = "Value: $" + (val * gcv).toLocaleString(undefined, {minimumFractionDigits: 2}) + " USD";
        }

        // --- DONNÉES RÉELLES ---
        async function fetchLiveTX() {
            try {
                const proxy = "https://corsproxy.io/?";
                const target = encodeURIComponent("https://api.mainnet.minepi.com/payments?limit=8&order=desc");
                const response = await fetch(proxy + target);
                const data = await response.json();
                const records = data._embedded.records;
                const ticker = document.getElementById('ticker');
                
                ticker.innerHTML = "";
                records.forEach(tx => {
                    const line = document.createElement('div');
                    line.className = 'tx-line';
                    const from = tx.from.substring(0,8);
                    line.innerHTML = `TX: ${from}... | <span class="tx-amount">${tx.amount} PI</span> | STATUS: <span style="color:#00ff00">GCV TARGET</span>`;
                    ticker.appendChild(line);
                });
            } catch (e) {
                console.log("Connection sync...");
            }
        }
        setInterval(fetchLiveTX, 8000);
        fetchLiveTX();
    </script>
</body>
</html>
