<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARC-314 | QUANTUM HUD</title>
    <style>
        :root { --cyan: #00f2ff; --gold: #FFD700; }
        body { 
            background: #000; color: var(--cyan); font-family: 'Courier New', monospace; 
            margin: 0; height: 100vh; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        /* MATRIX FX */
        canvas { position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.15; }

        /* INTERFACE HOLOGRAPHIQUE */
        .hud-container {
            width: 90%; max-width: 450px;
            background: rgba(0, 20, 30, 0.8);
            border: 2px solid var(--cyan);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 40px rgba(0, 242, 255, 0.2), inset 0 0 20px rgba(0, 242, 255, 0.1);
            position: relative;
        }

        .hud-container::before {
            content: "ARC-314 SECURE TERMINAL";
            position: absolute; top: -12px; left: 20px;
            background: var(--cyan); color: #000;
            padding: 2px 10px; font-size: 0.7em; font-weight: bold;
        }

        h1 { font-size: 1.2em; text-align: center; color: var(--gold); letter-spacing: 4px; margin-bottom: 30px; }

        .input-group { margin-bottom: 25px; }
        label { display: block; font-size: 0.7em; margin-bottom: 8px; opacity: 0.8; }
        
        input { 
            width: 100%; background: rgba(0,0,0,0.6); border: 1px solid var(--gold);
            color: var(--gold); font-size: 2em; padding: 10px;
            text-align: center; box-sizing: border-box; outline: none;
        }

        .result-box {
            border-top: 1px solid rgba(0, 242, 255, 0.3);
            padding-top: 20px; text-align: center;
        }

        .pi-val { font-size: 2.5em; color: var(--gold); font-weight: bold; text-shadow: 0 0 15px var(--gold); }

        .status-bar {
            margin-top: 30px; font-size: 0.6em; border: 1px solid rgba(0, 242, 255, 0.2);
            padding: 10px; background: rgba(0,0,0,0.4);
        }

        footer { margin-top: 20px; font-size: 0.8em; color: var(--gold); font-weight: bold; letter-spacing: 3px; }
    </style>
</head>
<body>
    <canvas id="m"></canvas>

    <div class="hud-container">
        <h1>QUANTUM GCV</h1>
        
        <div class="input-group">
            <label>> INPUT_USD_VALUATION</label>
            <input type="number" id="usd" placeholder="0.00" oninput="calc()">
        </div>

        <div class="result-box">
            <label>> OUTPUT_PI_REQUIRED</label>
            <div id="pi" class="pi-val">0.000000</div>
            <div style="font-size: 0.6em; margin-top: 5px;">CONSENSUS: $314,159</div>
        </div>

        <div class="status-bar">
            SYSTEM: ONLINE<br>
            NET: PI MAINNET<br>
            LOC: THAILAND_SANCTUARY_ALPHA
        </div>
    </div>

    <footer>ARC314</footer>

    <script>
        const canvas = document.getElementById('m'), ctx = canvas.getContext('2d');
        let w = canvas.width = window.innerWidth, h = canvas.height = window.innerHeight;
        const drops = Array(Math.floor(w/20)).fill(1);
        function draw() {
            ctx.fillStyle = "rgba(0,0,0,0.1)"; ctx.fillRect(0,0,w,h);
            ctx.fillStyle = "#00f2ff"; ctx.font = "15px monospace";
            drops.forEach((y, i) => {
                ctx.fillText("π", i*20, y*20);
                if(y*20 > h && Math.random() > 0.98) drops[i] = 0; drops[i]++;
            });
        }
        setInterval(draw, 50);

        function calc() {
            const v = document.getElementById('usd').value;
            const gcv = 314159;
            document.getElementById('pi').innerText = (v > 0 ? (v / gcv).toFixed(6) : "0.000000");
        }
    </script>
</body>
</html>
