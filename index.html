<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARC-314 | DUAL QUANTUM ENGINE</title>
    <style>
        :root { --cyan: #00f2ff; --gold: #FFD700; --bg: #00080a; }
        body, html { background: #000; color: var(--cyan); font-family: 'Courier New', monospace; margin: 0; padding: 0; overflow: hidden; height: 100vh; }

        canvas { position: fixed; top: 0; left: 0; z-index: 1; opacity: 0.15; }

        .hud-frame {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            border: 2px solid var(--cyan); box-sizing: border-box; z-index: 100;
            pointer-events: none; box-shadow: inset 0 0 30px rgba(0, 242, 255, 0.2);
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 0 0, 5px 5px, 5px calc(100% - 5px), calc(100% - 5px) calc(100% - 5px), calc(100% - 5px) 5px, 5px 5px);
        }

        .interface {
            position: relative; z-index: 10; height: 100vh;
            display: flex; flex-direction: column; padding: 20px; box-sizing: border-box;
        }

        header { border-bottom: 2px solid var(--gold); padding-bottom: 10px; margin-bottom: 20px; }
        .title { font-size: 1.4em; font-weight: bold; letter-spacing: 4px; color: var(--gold); }

        .main-container { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 20px; }

        .quantum-panel {
            background: rgba(0, 20, 35, 0.85); border: 1px solid var(--cyan);
            padding: 15px; position: relative; backdrop-filter: blur(5px);
        }
        .quantum-panel::before { content: "DATA_CORE"; position: absolute; top: -10px; right: 10px; background: var(--cyan); color: #000; font-size: 0.6em; padding: 2px 5px; }

        label { display: block; font-size: 0.7em; margin-bottom: 5px; color: var(--gold); }
        input { 
            width: 100%; background: #000; border: 1px solid var(--gold); color: var(--gold); 
            font-size: 2em; text-align: center; outline: none; padding: 10px; box-sizing: border-box;
        }

        .convert-label { text-align: center; font-size: 0.8em; margin: 5px 0; color: var(--cyan); font-weight: bold; }

        .status-box { font-size: 0.65em; line-height: 1.6; border-left: 3px solid var(--gold); padding-left: 10px; margin-top: 10px; }

        footer { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 10px; border-top: 1px solid var(--cyan); padding-top: 10px; }
        .arc-sig { font-size: 1.6em; font-weight: bold; color: var(--gold); letter-spacing: 8px; }
    </style>
</head>
<body>

    <div class="hud-frame"></div>
    <canvas id="m"></canvas>

    <div class="interface">
        <header>
            <div class="title">ARC-314 // DUAL-ENGINE</div>
            <div style="font-size: 0.6em;">KOSASIH ARCHITECTURE | GCV: $314,159</div>
        </header>

        <div class="main-container">
            <div class="quantum-panel">
                <label>> FIAT_INPUT (USD $)</label>
                <input type="number" id="usdIn" placeholder="0.00" oninput="toPi()">
                <div class="convert-label">▼ CONVERT_TO_PI ▼</div>
                <div id="piOut" style="font-size: 2.2em; text-align: center; font-weight: bold; color: var(--gold);">0.000000 Π</div>
            </div>

            <div class="quantum-panel">
                <label>> PI_INPUT (Π)</label>
                <input type="number" id="piIn" placeholder="0.000000" oninput="toUsd()">
                <div class="convert-label">▲ CONVERT_TO_USD ▲</div>
                <div id="usdOut" style="font-size: 2.2em; text-align: center; font-weight: bold; color: var(--gold);">$ 0.00</div>
            </div>

            <div class="status-box">
                NETWORK: MAINNET_LIVE<br>
                AUTH: ARC-314_UNIT<br>
                LOC: THAILAND_SANCTUARY_ALPHA
            </div>
        </div>

        <footer>
            <div style="font-size: 0.55em; opacity: 0.7;">
                SYSTEM_ID: CRYPTOSHUN1980<br>
                PROTOCOL: GLT-314
            </div>
            <div class="arc-sig">ARC314</div>
        </footer>
    </div>

    <script>
        const c = document.getElementById('m'), x = c.getContext('2d');
        let w = c.width = window.innerWidth, h = c.height = window.innerHeight;
        const d = Array(Math.floor(w/20)).fill(1);
        const GCV = 314159;

        function draw() {
            x.fillStyle = "rgba(0,0,0,0.15)"; x.fillRect(0,0,w,h);
            x.fillStyle = "#00f2ff"; x.font = "14px monospace";
            d.forEach((y, i) => {
                x.fillText("ARC314"[Math.floor(Math.random()*6)], i*20, y*20);
                if(y*20 > h && Math.random() > 0.98) d[i] = 0; d[i]++;
            });
        }
        setInterval(draw, 50);

        function toPi() {
            const val = document.getElementById('usdIn').value;
            document.getElementById('piOut').innerText = (val > 0 ? (val / GCV).toFixed(7) : "0.000000") + " Π";
        }

        function toUsd() {
            const val = document.getElementById('piIn').value;
            document.getElementById('usdOut').innerText = "$ " + (val > 0 ? (val * GCV).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) : "0.00");
        }
    </script>
</body>
</html>
