<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARC-314 | GCV QUANTUM HUD</title>
    <style>
        body {
            background-color: #000;
            color: #00d4ff;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Effet Matrix en arrière-plan */
        #matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.3;
        }

        header {
            text-align: center;
            padding: 20px;
            border-bottom: 2px solid #FFD700;
            width: 100%;
            box-shadow: 0 0 20px #00d4ff;
            background: rgba(0, 0, 0, 0.8);
        }

        h1 {
            color: #FFD700;
            text-shadow: 0 0 10px #FFD700;
            margin: 0;
            letter-spacing: 5px;
        }

        .main-layout {
            display: flex;
            justify-content: space-around;
            width: 95%;
            margin-top: 30px;
            gap: 20px;
        }

        .panel {
            background: rgba(0, 20, 50, 0.85);
            border: 2px solid #FFD700;
            box-shadow: 0 0 15px #005f73;
            padding: 20px;
            flex: 1;
            min-height: 300px;
        }

        h3 {
            color: #FFD700;
            border-bottom: 1px solid #00d4ff;
            padding-bottom: 10px;
        }

        input#piAmount {
            background: #000;
            border: 1px solid #00d4ff;
            color: #FFD700;
            padding: 15px;
            width: 90%;
            margin: 20px 0;
            font-size: 1.5em;
            text-align: center;
        }

        #resultUSD {
            font-weight: bold;
            font-size: 2em;
            color: #FFD700;
            text-shadow: 0 0 8px #FFD700;
        }

        #ticker {
            height: 200px;
            overflow: hidden;
            font-size: 0.9em;
        }

        .tx-line {
            padding: 5px 0;
            border-bottom: 1px solid rgba(0, 212, 255, 0.2);
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        footer {
            margin-top: auto;
            padding: 20px;
            color: #FFD700;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <canvas id="matrix-bg"></canvas>

    <header>
        <h1>ARC-314 | GCV QUANTUM HUD</h1>
        <p>SECURE COMMAND CENTER - GLOBAL CONSENSUS VALUE</p>
    </header>

    <div class="main-layout">
        <div class="panel">
            <h3>QUANTUM CONVERTER</h3>
            <p>Enter Pi Amount to calculate GCV Value:</p>
            <input type="number" id="piAmount" placeholder="0.00" oninput="calculate()">
            <div id="resultUSD">Value: $0.00 USD</div>
        </div>

        <div class="panel">
            <h3>LIVE NETWORK FEED</h3>
            <div id="ticker">
                <div class="tx-line">INITIALIZING QUANTUM LINK...</div>
            </div>
        </div>
    </div>

    <footer>
        DESIGNED BY ARC-314 | ARCHITECTURE BY KOKKALIS | FOR PIMAN
    </footer>

    <script>
        // --- MATRIX EFFECT ---
        const canvas = document.getElementById('matrix-bg');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#00d4ff";
            ctx.font = fontSize + "px monospace";
            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 50);

        // --- CALCULATEUR GCV ---
        function calculate() {
            const val = document.getElementById('piAmount').value;
            const gcv = 314159; // Valeur cible
            const total = val * gcv;
            document.getElementById('resultUSD').innerText = "Value: $" + total.toLocaleString() + " USD";
        }

        // --- TICKER SIMULATION ---
        function addTX() {
            const ticker = document.getElementById('ticker');
            const hashes = ["0x88..F2", "0x41..A9", "0x31..14", "0x09..BC"];
            const h = hashes[Math.floor(Math.random() * hashes.length)];
            const amt = (Math.random() * 5).toFixed(2);
            
            const line = document.createElement('div');
            line.className = 'tx-line';
            line.innerHTML = `[CONFIRMED] NODE_${h} | ${amt} PI | GCV STATUS: ACTIVE`;
            
            ticker.prepend(line);
            if (ticker.childNodes.length > 8) ticker.removeChild(ticker.lastChild);
        }
        setInterval(addTX, 3000);
    </script>
</body>
</html>
