<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARC-314 // STEALTH CORE</title>
    <style>
        :root { 
            --neon: #00f2ff; 
            --gold: #FFD700; 
            /* Lueur intense multicouche */
            --neon-glow: 0 0 10px #00f2ff, 0 0 20px #00f2ff, 0 0 40px rgba(0, 242, 255, 0.5);
            --gold-glow: 0 0 10px #FFD700, 0 0 25px rgba(255, 215, 0, 0.7);
        }
        
        body, html { background: #000; color: var(--neon); font-family: 'Courier New', monospace; margin: 0; padding: 0; overflow: hidden; height: 100vh; }

        /* Matrice de fond */
        canvas { position: fixed; top: 0; left: 0; z-index: 1; opacity: 0.75; filter: brightness(1.3); }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 10%, rgba(0,0,0,0.9) 100%);
            z-index: 2; pointer-events: none;
        }

        .container {
            position: relative; z-index: 10; height: 100vh;
            display: flex; align-items: center; justify-content: center; padding: 10px;
        }

        /* TERMINAL RECTANGULAIRE NET (SANS ANGLES COUPÉS) */
        .terminal {
            width: 95%; max-width: 520px;
            background: rgba(0, 8, 15, 0.95);
            border: 3px solid var(--neon);
            box-shadow: var(--neon-glow), inset 0 0 30px rgba(0, 242, 255, 0.3);
            padding: 30px;
            /* Pas de clip-path ici pour garder les angles droits */
        }

        header { border-bottom: 2px solid var(--gold); margin-bottom: 25px; padding-bottom: 15px; }
        .title { font-size: 2em; font-weight: bold; color: var(--gold); text-shadow: var(--gold-glow); letter-spacing: 5px; }

        /* MOTEURS DE RECHERCHE RECTANGULAIRES */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .box { 
            border: 2px solid var(--neon); 
            background: rgba(0,0,0,0.9); 
            padding: 20px; 
            text-align: center;
            box-shadow: inset 0 0 15px rgba(0, 242, 255, 0.4);
        }
        
        label { font-size: 0.7em; color: var(--gold); display: block; margin-bottom: 10px; text-shadow: 0 0 5px var(--gold); font-weight: bold; }
        input { 
            background: transparent; border: none; border-bottom: 2px solid var(--gold); 
            color: var(--gold); width: 90%; font-size: 1.8em; text-align: center; outline: none;
            text-shadow: var(--gold-glow); font-weight: bold;
        }
        .res { font-size: 1.4em; font-weight: bold; color: var(--gold); margin-top: 12px; text-shadow: var(--gold-glow); }

        .stream { height: 120px; overflow: hidden; font-size: 0.85em; border-top: 1px solid rgba(0,242,255,0.5); padding-top: 15px; }
        .tx { display: flex; justify-content: space-between; padding: 6px 0; color: #fff; text-shadow: 0 0 10px #fff; }

        footer { margin-top: 35px; display: flex; justify-content: space-between; align-items: flex-end; }
        .signature { font-size: 3.8em; font-weight: bold; color: var(--gold); letter-spacing: 12px; text-shadow: var(--gold-glow); line-height: 1; }
        
        /* INFO SÉCURISÉE SANS GÉOLOCALISATION */
        .status-info { font-size: 0.65em; color: var(--neon); line-height: 1.8; text-transform: uppercase; text-shadow: 0 0 5px var(--neon); }
    </style>
</head>
<body>

<canvas id="m"></canvas>
<div class="overlay"></div>

<div class="container">
    <div class="terminal">
        <header>
            <div style="font-size: 0.6em; color: var(--neon); text-shadow: var(--neon-glow); margin-bottom: 8px;">
                SYSTEM_ACCESS: GRANTED // SECURITY_LEVEL: MAXIMUM
            </div>
            <div class="title">ARC-314 // CORE</div>
            <div style="font-size: 0.7em; color: var(--neon); font-weight: bold;">GCV: $314,159 | PROTOCOL: GLT-314</div>
