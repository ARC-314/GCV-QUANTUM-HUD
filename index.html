<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARC-314 | QUANTUM COMPUTER TERMINAL</title>
    <style>
        :root {
            --quantum-blue: #00f2ff;
            --quantum-gold: #FFD700;
            --core-glow: rgba(0, 242, 255, 0.6);
        }

        body { 
            background: #000205; 
            color: var(--quantum-blue); 
            font-family: 'Courier New', monospace; 
            margin: 0; overflow: hidden; height: 100vh;
            perspective: 1500px;
        }

        #matrix-bg { position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.6; }

        .quantum-core {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) rotateX(60deg);
            z-index: 0;
        }

        .ring {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 2px solid var(--quantum-blue);
            box-shadow: 0 0 50px var(--core-glow), inset 0 0 30px var(--core-glow);
            animation: rotate 10s linear infinite;
        }
        .r1 { width: 700px; height: 700px; border-style: dashed; animation-duration: 20s; opacity: 0.4; }
        .r2 { width: 550px; height: 550px; border: 10px double var(--quantum-gold); animation-direction: reverse; animation-duration: 15s; opacity: 0.7; }
        .r3 { width: 300px; height: 300px; border: 5px solid var(--quantum-blue); animation-duration: 5s; box-shadow: 0 0 100px var(--quantum-blue); }

        @keyframes rotate { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }
