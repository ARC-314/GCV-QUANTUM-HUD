<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARC-314 // STABLE CORE</title>
    <style>
        :root { 
            --neon: #00f2ff; 
            --gold: #FFD700; 
        }
        
        body, html { background: #000; color: var(--neon); font-family: 'Courier New', monospace; margin: 0; padding: 0; overflow: hidden; height: 100vh; }

        /* Matrix simplifié pour la performance */
        canvas { position: fixed; top: 0; left: 0; z-index: 1; opacity: 0.6; }

        .container {
            position: relative; z-index: 10; height: 100vh;
            display: flex; align-items: center; justify-content: center; padding: 10px;
        }

        /* TERMINAL LARGE ET OPAQUE (Plus de transparence = Plus d'écran noir) */
        .terminal {
            width: 95%; max-width: 600px;
            background: #000a10; /* Opaque pour soulager le GPU */
            border: 3px solid var(--neon);
            padding: 30px;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.5);
        }

        header { border-bottom: 2px solid var(--gold); margin-bottom: 20px; padding-bottom: 15px; }
        .title { font-size: 2.2em; font-weight: bold; color: var(--gold); letter-spacing: 4px; text-shadow: 2px 2px #000; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .box { 
            border: 1px solid var(--neon); background: #000; padding: 20px; text-align: center;
        }
        
        label { font-size: 0.7em; color: var(--gold); display: block; margin-bottom: 5px; font-weight: bold; }
        input { 
            background: transparent; border: none; border-bottom: 2px solid var(--gold); 
            color: var(--gold); width: 90%; font-size: 1.8em; text-align: center; outline: none;
        }
        .res { font-size: 1.5em; font-weight: bold; color: var(--gold); margin-top: 10px; }

        .stream { height: 100px; overflow: hidden; font-size: 0.8em; border-top: 1px solid var(--neon); padding-top: 15px; color: #fff; }
        .tx { display: flex; justify-content: space-between; padding: 4px 0; }

        footer { margin-top: 30px; display: flex; justify-content: space-between; align-items: flex-end; }
        .signature { font-size: 4em; font-weight: bold; color: var(--gold); letter-spacing: 12px; line-height: 1; }
    </style>
</head>
