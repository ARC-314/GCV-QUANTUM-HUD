<html lang="fr">

    <title>ARC-314 // AGENT CORE LARGE</title>
    <style>
        :root { 
            --neon: #00f2ff; 
            --gold: #FFD700; 
            --neon-glow: 0 0 5px #00f2ff, 0 0 10px #00f2ff, 0 0 20px rgba(0, 242, 255, 0.7);
            --gold-glow: 0 0 5px #FFD700, 0 0 15px rgba(255, 215, 0, 0.6);
        }
        
        body, html { background: #000; color: var(--neon); font-family: 'Courier New', monospace; margin: 0; padding: 0; overflow: hidden; height: 100vh; }

        canvas { position: fixed; top: 0; left: 0; z-index: 1; opacity: 0.8; }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 10%, rgba(0,0,0,0.85) 100%);
            z-index: 2; pointer-events: none;
        }

        .container {
            position: relative; z-index: 10; height: 100vh;
            display: flex; align-items: center; justify-content: center; padding: 10px;
        }

        /* MODULE AGRANDI À 650PX */
        .terminal {
            width: 95%; max-width: 650px;
            background: rgba(0, 5, 10, 0.9);
            border: 2px solid var(--neon);
            box-shadow: var(--neon-glow), inset 0 0 20px rgba(0, 242, 255, 0.3);
            padding: 40px; /* Plus d'espace interne */
            border-radius: 2px;
        }

        header { border-bottom: 2px solid var(--gold); margin-bottom: 30px; padding-bottom: 15px; box-shadow: 0 5px 10px -5px var(--gold); }
        .title { font-size: 2.2em; font-weight: bold; color: var(--gold); text-shadow: var(--gold-glow); letter-spacing: 4px; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-bottom: 30px; }
        .box { 
            border: 1px solid var(--neon); background: rgba(0,0,0,0.8); padding: 25px; text-align: center;
            box-shadow: inset 0 0 15px rgba(0, 242, 255, 0.4);
        }
        
        label { font-size: 0.7em; color: var(--gold); display: block; margin-bottom: 8px; text-shadow: 0 0 5px var(--gold); font-weight: bold; }
