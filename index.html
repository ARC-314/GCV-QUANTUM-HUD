<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARC-314 // STEALTH CORE</title>
    <style>
        :root { 
            --neon: #00f2ff; 
            --gold: #FFD700; 
            /* Lueur néon renforcée pour compenser le retrait des filtres lourds */
            --neon-glow: 0 0 10px #00f2ff, 0 0 20px rgba(0, 242, 255, 0.6);
            --gold-glow: 0 0 10px #FFD700, 0 0 20px rgba(255, 215, 0, 0.5);
        }
        
        body, html { background: #000; color: var(--neon); font-family: 'Courier New', monospace; margin: 0; padding: 0; overflow: hidden; height: 100vh; }

        canvas { position: fixed; top: 0; left: 0; z-index: 1; opacity: 0.8; }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 15%, rgba(0,0,0,0.9) 100%);
            z-index: 2; pointer-events: none;
        }

        .container {
            position: relative; z-index: 10; height: 100vh;
            display: flex; align-items: center; justify-content: center; padding: 10px;
        }

        /* TERMINAL RECTANGULAIRE NET (ANGLES DROITS) */
        .terminal {
            width: 100%; max-width: 480px;
            background: rgba(0, 8, 15, 0.95);
            border: 2px solid var(--neon);
            box-shadow: var(--neon-glow), inset 0 0 25px rgba(0, 242, 255, 0.2);
            padding: 30px;
            /* clip-path supprimé pour garder les angles droits */
        }

        header { border-bottom: 2px solid var(--gold); margin-bottom: 25px; padding-bottom: 12px; }
        .title { font-size: 1.8em; font-weight: bold; color: var(--gold); text-shadow: var(--gold-glow); letter-spacing: 4px; }

        /* BOXES DE CALCUL RECTANGULAIRES */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .box { 
            border: 1px solid var(--neon); 
            background: rgba(0,0,0,0.9); 
            padding: 15px; 
            text-align: center;
            box-shadow: inset 0 0 15px rgba(0, 242, 255, 0.3);
            /* clip-path supprimé ici aussi */
        }
        
        label { font-size: 0.65em; color: var(--gold); display: block; margin-bottom: 8px; text-shadow: 0 0 5px var(--gold); font-weight: bold; }
