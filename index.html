<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARC-314 // CORE</title>
    <style>
        :root { 
            --neon: #00f2ff; 
            --gold: #FFD700; 
            --neon-glow: 0 0 15px rgba(0, 242, 255, 0.8);
            --gold-glow: 0 0 12px rgba(255, 215, 0, 0.7);
        }
        
        body, html { background: #000; color: var(--neon); font-family: 'Courier New', monospace; margin: 0; padding: 0; overflow: hidden; height: 100vh; }

        /* Matrice optimisée pour éviter l'écran noir */
        canvas { position: fixed; top: 0; left: 0; z-index: 1; opacity: 0.7; }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.9) 100%);
            z-index: 2; pointer-events: none;
        }

        .container {
            position: relative; z-index: 10; height: 100vh;
            display: flex; align-items: center; justify-content: center; padding: 10px;
        }

        /* TERMINAL RECTANGULAIRE (ANGLES DROITS) */
        .terminal {
            width: 95%; max-width: 480px;
            background: rgba(0, 10, 20, 0.95);
            border: 2px solid var(--neon);
            box-shadow: var(--neon-glow), inset 0 0 20px rgba(0, 242, 255, 0.2);
            padding: 25px;
        }

        header { border-bottom: 2px solid var(--gold); margin-bottom: 20px; padding-bottom: 10px; }
        .title { font-size: 1.8em; font-weight: bold; color: var(--gold); text-shadow: var(--gold-glow); letter-spacing: 3px; }

        /* ENGINE BOXES RECTANGULAIRES */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .box { 
            border: 1px solid var(--neon); background: rgba(0,0,0,0.9); padding: 15px; text-align: center;
            box-shadow: inset 0 0 10px rgba(0, 242, 255, 0.3);
        }

        input {
