<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARC-314 | QUANTUM HUD</title>
    <style>
        :root { --cyan: #00f2ff; --gold: #FFD700; }
        body, html { background: #000; color: var(--cyan); font-family: 'Courier New', monospace; margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        
        /* FOND MATRIX */
        canvas { position: fixed; top: 0; left: 0; z-index: 1; opacity: 0.2; }

        /* EFFET HOLOGRAPHIQUE */
        .hologram { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%); background-size: 100% 3px; z-index: 100; pointer-events: none; }

        /* INTERFACE */
        .hud { position: relative; z-index: 10; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; box-sizing: border-box; }

        /* ANNEAUX QUANTIQUES */
        .rings { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) rotateX(70deg); z-index: 2; pointer-events: none; }
        .ring { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border-radius: 50%; border: 1px solid var(--cyan); animation: spin 15s linear infinite; }
        .r1 { width: 350px; height: 350px; border-style: dashed; opacity: 0.3; }
        .r2 { width: 250px; height: 250px; border: 4px double var(--gold); animation-direction: reverse; }

        @keyframes spin { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }

        /* PANNEAUX */
        .panel { background: rgba(0, 15, 25, 0.85); border: 1px solid var(--cyan); padding: 12px; backdrop-filter: blur(10px); box-shadow: 0 0 15px rgba(0, 242, 255, 0.2); }
        h2 { margin: 0 0 10px 0; font-size: 0.8em; color: var(--gold); letter-spacing: 2px; text-align: center; }
        
        input { background: rgba(0,0,0,0.5); border: 1px solid var(--gold); color: var(--gold); font-size: 1.5em; width: 100%; padding: 8px; box-sizing: border-box; text-align: center; outline: none; }
        #p { font-size: 1.8em; color: var(--gold); text-align: center; font-weight: bold; margin-top: 10px; }

        #stream { font-size: 0.75em; line-height: 1.6; height: 100px; overflow: hidden; }
        .tx { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(0,242,255,0.1); padding: 4px 0; }

        footer { display: flex; justify-content: space-between; font-size: 0.6em; color: var(--gold); padding-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <canvas id="m"></canvas>
    <div class="hologram"></div>
    
    <div class="rings">
        <div class="ring r1"></div>
        <div class="ring r2"></div>
    </div>

    <div class="hud">
        <div class="panel">
            <h2>[ ARC-314 QUANTUM CONVERTER ]</h2>
            <input type="number" id="u" placeholder="ENTRER USD $" oninput="c()">
            <div id="p">0.000000 Π</div>
            <div style="font-size: 0.5em; text-align: center; opacity: 0.7;">GCV CONSENSUS: $314,159</div>
        </div>

        <div style="flex-grow: 1;"></div>

        <div class="panel">
            <h2>[ LIVE BLOCKCHAIN STREAM ]</h2>
            <div id="stream"></div>
            <footer>
                <span>KOSASIH ARCHITECTURE</span>
                <span style="font-size: 1.5em;">ARC-314</span>
            </footer>
        </div>
    </div>

    <script>
        // Matrix
        const canvas = document.getElementById('m'), ctx = canvas.getContext('2d');
        let w = canvas.width = window.innerWidth, h = canvas.height = window.innerHeight;
        const drops = Array(Math.floor(w/20)).fill(1);
        function draw() {
            ctx.fillStyle = "rgba(0,0,0,0.1)"; ctx.fillRect(0,0,w,h);
            ctx.fillStyle = "#00f2ff"; ctx.font = "14px monospace";
            drops.forEach((y, i) => {
                ctx.fillText("π", i*20, y*20);
                if(y*20 > h && Math.random() > 0.98) drops[i] = 0; drops[i]++;
            });
        }
        setInterval(draw, 50);

        // Calcule GCV
        function c() {
            const v = document.getElementById('u').value;
            const gcv = 314159; // Valeur du consensus
            document.getElementById('p').innerText = (v > 0 ? (v / gcv).toFixed(6) : "0.000000") + " Π";
        }

        // Simulation Stream (pour éviter l'écran noir)
        const stream = document.getElementById('stream');
        function addTx() {
            const id = Math.random().toString(36).substring(2, 8).toUpperCase();
            const amt = (Math.random() * 50).toFixed(4);
            const line = `<div class="tx"><span>NODE:${id}</span><span style="color:#FFD700">${amt} Π</span></div>`;
            stream.innerHTML = line + stream.innerHTML;
            if(stream.children.length > 4) stream.lastChild.remove();
        }
        setInterval(addTx, 3000);
    </script>
</body>
</html>
