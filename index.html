<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARC-314 | TERMINAL GCV</title>
    <style>
        body { background: #000; color: #00f2ff; font-family: monospace; text-align: center; margin: 0; padding: 20px; }
        .hud-frame { border: 2px solid #FFD700; padding: 20px; background: rgba(0,20,30,0.9); max-width: 500px; margin: auto; box-shadow: 0 0 20px #00f2ff; }
        h1 { color: #FFD700; letter-spacing: 5px; font-size: 1.5em; }
        input { width: 90%; padding: 15px; font-size: 1.5em; background: #000; color: #FFD700; border: 1px solid #FFD700; margin: 20px 0; outline: none; }
        .resultat { font-size: 2.2em; color: #FFD700; font-weight: bold; text-shadow: 0 0 10px #FFD700; }
        .footer { margin-top: 30px; font-size: 0.8em; color: #FFD700; border-top: 1px solid #444; padding-top: 10px; }
    </style>
</head>
<body>
    <div class="hud-frame">
        <h1>ARC-314 // GCV TERMINAL</h1>
        <p>CONCEPTION : KOSASIH ARCHITECTURE</p>
        <hr style="border: 0.5px solid #00f2ff;">
        
        <p style="margin-top:20px;">ENTREZ MONTANT (USD $) :</p>
        <input type="number" id="usd" placeholder="0.00" oninput="calculer()">
        
        <p>VALEUR EN PI (Π) :</p>
        <div id="pi" class="resultat">0.000000 Π</div>
        
        <div class="footer">
            CONSENSUS : 314 159 USD [ARC314]
        </div>
    </div>

    <script>
        function calculer() {
            const usd = document.getElementById('usd').value;
            const gcv = 314159; // Valeur de consensus global
            const res = document.getElementById('pi');
            if (usd > 0) {
                res.innerText = (usd / gcv).toFixed(7) + " Π";
            } else {
                res.innerText = "0.000000 Π";
            }
        }
    </script>
</body>
</html>
