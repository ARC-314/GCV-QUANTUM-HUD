<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARC-314 // CORE STABLE</title>
    <style>
        /* Couleurs pures sans transparence pour éviter l'écran noir */
        :root { --neon: #00f2ff; --gold: #FFD700; }
        
        body, html { background: #000; color: var(--neon); font-family: 'Courier New', monospace; margin: 0; padding: 0; overflow: hidden; height: 100vh; }

        /* Matrix simplifié au maximum */
        canvas { position: fixed; top: 0; left: 0; z-index: 1; opacity: 0.6; }

        .container {
            position: relative; z-index: 10; height: 100vh;
            display: flex; align-items: center; justify-content: center; padding: 10px;
        }

        /* TERMINAL RECTANGULAIRE (ANGLES DROITS) */
        .terminal {
            width: 90%; max-width: 450px;
            background: #000; /* Fond noir plein pour stabilité */
            border: 2px solid var(--neon);
            padding: 20px;
            box-shadow: 0 0 15px var(--neon);
        }

        header { border-bottom: 2px solid var(--gold); margin-bottom: 15px; padding-bottom: 10px; }
        .title { font-size: 1.6em; font-weight: bold; color: var(--gold); letter-spacing: 2px; }

        /* BOITES DE CALCUL RECTANGULAIRES */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .box { border: 1px solid var(--neon); padding: 15px; text-align: center; background: #000; }
        
        label { font-size: 0.6em; color: var(--gold); display: block; margin-bottom: 5px; font-weight: bold; }
        input { 
            background: transparent; border: none; border-bottom: 1px solid var(--gold); 
            color: var(--gold); width: 80%; font-size: 1.4em; text-align: center; outline: none;
        }
        .res { font-size: 1.1em; font-weight: bold; color: var(--gold); margin-top: 8px; }

        .stream { height: 80px; overflow: hidden; font-size: 0.7em; border-top: 1px solid var(--neon); padding-top: 10px; }
        .tx { display: flex; justify-content: space-between; padding: 3px 0; color: #fff; }

        footer { margin-top: 20px; display: flex; justify-content: space-between; align-items: flex-end; }
        .signature { font-size: 3em; font-weight: bold; color: var(--gold); letter-spacing: 8px; line-height: 1; }
        .info { font-size: 0.55em; color: var(--neon); line-height: 1.5; text-transform: uppercase; }
    </style>
</head>
<body>

<canvas id="m"></canvas>

<div class="container">
    <div class="terminal">
        <header>
            <div style="font-size: 0.5em; margin-bottom: 4px;">SYSTEM: ACTIVE // ARC-314</div>
            <div class="title">ARC-314 // CORE</div>
            <div style="font-size: 0.6em; font-weight: bold;">GCV: $314,159 | ARCH: KOSASIH</div>
        </header>

        <div class="grid">
            <div class="box">
                <label>SEARCH USD</label>
                <input type="number" id="uIn" placeholder="0" oninput="calc()">
                <div id="pOut" class="res">0.00 Π</div>
            </div>
            <div class="box">
                <label>SEARCH PI</label>
                <input type="number" id="pIn" placeholder="0" oninput="calc()">
                <div id="uOut" class="res">$ 0.00</div>
            </div>
        </div>

        <div class="stream" id="st"></div>

        <footer>
            <div class="info">
                STATUS: ENCRYPTED<br>
                PIMAN: ACTIVE<br>
                LOC: [PROTECTED]
            </div>
            <div class="signature">ARC314</div>
        </footer>
    </div>
</div>

<script>
    const GCV = 314159;
    const canvas = document.getElementById('m'), ctx = canvas.getContext('2d');
    let w, h, columns;

    function init() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        columns = Array(Math.floor(w/15)).fill(1);
    }

    function draw() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.15)";
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = "#00f2ff";
        ctx.font = "14px monospace";
        columns.forEach((y, i) => {
            const char = "ARC314π$GLT"[Math.floor(Math.random()*11)];
            ctx.fillText(char, i * 15, y * 15);
            if (y * 15 > h && Math.random() > 0.98) columns[i] = 0;
            columns[i]++;
        });
    }

    window.addEventListener('resize', init);
    init();
    setInterval(draw, 70);

    function calc() {
        const u = document.getElementById('uIn').value;
        const p = document.getElementById('pIn').value;
        document.getElementById('pOut').innerText = (u > 0 ? (u / GCV).toFixed(7) : "0.00") + " Π";
        document.getElementById('uOut').innerText = "$ " + (p > 0 ? (p * GCV).toLocaleString() : "0.00");
    }

    const st = document.getElementById('st');
    function addTx() {
        const row = `<div class="tx"><span>ID-${Math.random().toString(36).substr(7).toUpperCase()}</span><span style="color:var(--gold)">+${(Math.random()*5).toFixed(4)} Π</span></div>`;
        st.innerHTML = row + st.innerHTML;
        if(st.children.length > 4) st.lastChild.remove();
    }
    setInterval(addTx, 2500);
</script>

</body>
</html>
